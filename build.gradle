buildscript {
    repositories {
        maven { url = uri("https://maven.fabricmc.net/") }
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:1.17.19"
    }
}
plugins {
    id "maven-publish"
}

// Keep all version pins in one map so buildAll and single-version builds resolve identically.
def versions = [
    "1.21.1": [
        loader:    "0.19.3",
        fabricApi: "0.116.15+1.21.1",
        fabricApiMinimum: "0.116.14+1.21.1",
        iris:      "1.8.8+1.21.1-fabric",
        legacy4j:  "1.21.1-1.8.6-lts+fabric",
        factoryApi:"1.21.1-2.2.8-fabric",
        modmenu:   "11.0.4",
        java:      21
    ],
    "1.21.8": [
        loader:    "0.19.3",
        fabricApi: "0.136.1+1.21.8",
        fabricApiMinimum: "0.136.1+1.21.8",
        iris:      "1.9.6+1.21.8-fabric",
        legacy4j:  "1.21.8-1.8.5+fabric",
        factoryApi:"1.21.8-2.2.8-fabric",
        modmenu:   "15.0.2",
        java:      21
    ],
    "1.21.10": [
        loader:    "0.19.3",
        fabricApi: "0.138.4+1.21.10",
        fabricApiMinimum: "0.138.4+1.21.10",
        iris:      "1.9.7+1.21.10-fabric",
        legacy4j:  "1.21.10-1.8.7+fabric",
        factoryApi:"1.21.10-2.2.8-fabric",
        modmenu:   "16.0.1",
        java:      21
    ],
    "26.1.2": [
        loader:         "0.19.3",
        fabricApi:      "0.155.2+26.1.2",
        fabricApiMinimum: "0.155.2+26.1.2",
        iris:           "1.11.3+26.1-fabric",
        legacy4j:       "26.1.2-1.9-pre-2-fabric",
        factoryApi:     "26.1.2-2.2.8-fabric",
        modmenu:        "18.0.0",
        java:           25,
        nonObfuscated:  true
    ],
    "26.2": [
        loader:         "0.19.3",
        fabricApi:      "0.157.0+26.2",
        fabricApiMinimum: "0.155.2+26.2",
        iris:           "1.11.2+26.2-fabric",
        legacy4j:       "26.2-1.9-pre-2-fabric",
        legacy4jDirect: true,
        modmenu:        "20.0.1",
        java:           25,
        nonObfuscated:  true
    ],
]

def targetMc = findProperty("mc") ?: gradle.ext.defaultMc

if (!versions.containsKey(targetMc)) {
    throw new GradleException(
        "Unsupported MC version '${targetMc}'.\n" +
        "Valid options: ${versions.keySet().sort().join(', ')}\n" +
        "Example: ./gradlew build -Pmc=1.21.10"
    )
}

def v = versions[targetMc]

// Loom must be selected after target version resolution because plugin behavior differs by mapping model.
def isNonObfuscated = v.nonObfuscated ?: false
if (isNonObfuscated) {
    apply plugin: "net.fabricmc.fabric-loom"
} else {
    apply plugin: "net.fabricmc.fabric-loom-remap"
}

if (isNonObfuscated) {
    sourceSets.main.java.srcDirs += "src/main/java-26"
}

group   = "com.mtxcore.unifiedlegacysettings"
version = "${mod_version}+mc${targetMc}"

base {
    archivesName = "unified-legacy-settings"
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url  = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup "maven.modrinth" }
    }

    ivy {
        name = "Legacy4JGitHubReleases"
        url = "https://github.com/omo50/l4jnext2/releases/download"
        patternLayout {
            artifact "[artifact]-[revision]/[artifact]-[revision].[ext]"
        }
        metadataSources { artifact() }
        content { includeGroup "wily.legacy.github" }
    }
}

def implConfig      = isNonObfuscated ? "implementation"  : "modImplementation"
def compileOnlyConf = isNonObfuscated ? "compileOnly"     : "modCompileOnly"
def embeddedFactoryApi = layout.buildDirectory.file(
    "generated/legacy4j-deps/factory_api-fabric-26.2-2.2.8.jar"
)

configurations {
    legacy4jDirect
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMc}"
    if (!isNonObfuscated) {
        mappings loom.officialMojangMappings()
    }

    "${implConfig}" "net.fabricmc:fabric-loader:${v.loader}"
    "${implConfig}" "net.fabricmc.fabric-api:fabric-api:${v.fabricApi}"

    "${compileOnlyConf}" "maven.modrinth:iris:${v.iris}"
    if (v.legacy4jDirect) {
        legacy4jDirect("wily.legacy.github:Legacy4J:${v.legacy4j}@jar") {
            transitive = false
        }
        "${compileOnlyConf}"("wily.legacy.github:Legacy4J:${v.legacy4j}@jar") {
            transitive = false
        }
        "${compileOnlyConf}" files(embeddedFactoryApi)
    } else {
        "${compileOnlyConf}" "maven.modrinth:legacy4j:${v.legacy4j}"
    }
    if (v.factoryApi) {
        "${compileOnlyConf}" "maven.modrinth:factory-api:${v.factoryApi}"
    }

    "${compileOnlyConf}" "maven.modrinth:modmenu:${v.modmenu}"
}

if (v.legacy4jDirect) {
    def extractLegacyFactoryApi = tasks.register("extractLegacyFactoryApi", Copy) {
        from { configurations.legacy4jDirect.collect { zipTree(it) } }
        include "META-INF/jars/factory_api-fabric-26.2-2.2.8.jar"
        eachFile { path = name }
        includeEmptyDirs = false
        into embeddedFactoryApi.get().asFile.parentFile
    }
    tasks.named("compileJava") {
        dependsOn extractLegacyFactoryApi
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(v.java)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release  = v.java
}

processResources {
    inputs.property "version",               project.version
    inputs.property "mc_version",            targetMc
    inputs.property "fabric_loader_version", v.loader
    inputs.property "fabric_api_minimum",    v.fabricApiMinimum
    inputs.property "modmenu_version",       v.modmenu
    inputs.property "iris_version",          v.iris

    filesMatching("*.mod.json") {
        expand(
            version:               project.version,
            mc_version:            targetMc,
            fabric_loader_version: v.loader,
            fabric_api_minimum:    v.fabricApiMinimum,
            modmenu_version:       v.modmenu,
            iris_version:          v.iris
        )
    }
}

tasks.register("buildAll") {
    group       = "build"
    description = "Builds a jar for every supported Minecraft version."

    def execOps = services.get(org.gradle.process.ExecOperations)

    doLast {
        def failures = []
        def isWindows = System.properties["os.name"].toLowerCase().contains("win")
        def gradleCmd = isWindows ? "gradlew.bat" : "./gradlew"
        def libsDir = layout.buildDirectory.dir("libs").get().asFile

        delete fileTree(dir: libsDir, include: "${base.archivesName.get()}-*.jar")

        // Run each version in its own Gradle invocation to avoid Loom cross-version state bleed.
        versions.keySet().sort().each { mc ->
            println "\n========== Building for MC ${mc} =========="

            def vmap = versions[mc]
            def cmdLine = [gradleCmd, "build", "-Pmc=${mc}", "--console=plain"]
            def mcPropertyName = "mc${mc.replace('.', '_')}JavaHome"
            def javaHome = findProperty(mcPropertyName)
                ?: findProperty("java${vmap.java}Home")
                ?: System.getenv("JAVA${vmap.java}_HOME")
            if (javaHome) {
                cmdLine += "-Dorg.gradle.java.home=${javaHome}"
            }

            def result = execOps.exec {
                commandLine cmdLine
                ignoreExitValue = true
            }

            if (result.getExitValue() != 0) {
                failures << mc
                println "FAILED for MC ${mc}"
            } else {
                println "SUCCESS for MC ${mc}"
            }
        }

        if (failures) {
            throw new GradleException("buildAll failed for: ${failures.join(', ')}")
        }

        println "\n========== buildAll complete =========="
        println "Jars are in build/libs/"
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = base.archivesName.get()
        }
    }
}
